
{% extends 'base.html' %}

{% block content %}

{% include 'flash.html' %}

<link rel="stylesheet" href="/static/style/add_student.css">

<div class="student-page-title">

    <div class="student-page-icon">
        ✏️
    </div>

    <h1>
        ویرایش دانش‌آموز
    </h1>

    <p>
        اطلاعات دانش‌آموز را ویرایش کنید
    </p>

</div>


<form
    action="{{ url_for('edit_student', student_id=student.id) }}"
    method="POST"
    class="student-form"
>


    <!-- نام -->
    <div class="form-group">

        <label>
            نام
        </label>

        <input
            type="text"
            name="first_name"
            value="{{ student.first_name or '' }}"
            placeholder="نام دانش‌آموز را وارد کنید"
            required
        >

    </div>


    <!-- نام خانوادگی -->
    <div class="form-group">

        <label>
            نام خانوادگی
        </label>

        <input
            type="text"
            name="last_name"
            value="{{ student.last_name or '' }}"
            placeholder="نام خانوادگی را وارد کنید"
            required
        >

    </div>


    <!-- کد ملی -->
    <div class="form-group">

        <label>
            کد ملی
        </label>

        <input
            type="text"
            name="national_id_code"
            value="{{ student.national_id_code or '' }}"
            placeholder="کد ملی را وارد کنید"
            required
        >

    </div>


    <!-- کد دانش‌آموزی -->
    <div class="form-group">

        <label>
            کد دانش‌آموزی
        </label>

        <input
            type="text"
            name="student_id_code"
            value="{{ student.student_id_code or '' }}"
            placeholder="کد دانش‌آموزی را وارد کنید"
            required
        >

    </div>


    <!-- شماره تلفن -->
    <div class="form-group">

        <label>
            شماره تلفن
        </label>

        <input
            type="tel"
            name="phone_number"
            value="{{ student.phone_number or '' }}"
            placeholder="شماره تلفن را وارد کنید"
            required
        >

    </div>


    <!-- شماره تلفن دوم -->
    <div class="form-group">

        <label>
            شماره تلفن دوم
        </label>

        <input
            type="tel"
            name="phone_number_two"
            value="{{ student.phone_number_two or '' }}"
            placeholder="شماره تلفن دوم را وارد کنید"
        >

    </div>


    <!-- نام پدر -->
    <div class="form-group">

        <label>
            نام پدر
        </label>

        <input
            type="text"
            name="father_name"
            value="{{ student.father_name or '' }}"
            placeholder="نام پدر را وارد کنید"
            required
        >

    </div>


    <!-- تاریخ تولد -->
    <div class="form-group">

        <label>
            تاریخ تولد
        </label>

        <input
            type="text"
            name="birthday"
            value="{{ student.birthday or '' }}"
            placeholder="مثلاً ۱۳۹۰/۰۵/۲۱"
            required
        >

    </div>


    <!-- نام مدرسه -->
    <div class="form-group">

        <label>
            نام مدرسه
        </label>

        <input
            type="text"
            name="school_name"
            value="{{ student.school_name or '' }}"
            placeholder="نام مدرسه را وارد کنید"
            required
        >

    </div>

 <!-- آدرس-->
    <div class="form-group">

        <label>
          نشانی
        </label>

        <input
            type="text"
            name="address"
            value="{{ student.address or '' }}"
            placeholder=" نشانی را وارد کنید"
            required
        >

    </div>



    <!-- دکمه ذخیره -->

    <button
        type="submit"
        class="submit-button"
    >
        💾 ذخیره تغییرات
    </button>


    <!-- دکمه بازگشت -->

     <button     onclick="history.back()">
        بازگشت 
    </button>


</form>

{% endblock %}
