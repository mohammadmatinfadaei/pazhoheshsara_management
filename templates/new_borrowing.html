{% extends 'base.html' %}

{% block content %}

{% include 'flash.html' %}

<link rel="stylesheet" href="/static/style/new_borrowing.css">


<div class="borrowing-page-title">

    <h1>📚 ثبت امانت کتاب</h1>

    <p>
        اطلاعات دانش‌آموز و کتاب‌های مورد نظر را وارد کنید
    </p>

</div>


<form
    action="{{ url_for('save_borrowing') }}"
    method="POST"
    class="borrowing-form"
>


    <!-- =========================
         دانش آموز
    ========================== -->

    <div class="borrowing-section-title">
        👨‍🎓 انتخاب دانش‌آموز
    </div>


    <div class="borrowing-form-group">

        <label>
            دانش‌آموز
        </label>

        <input
            type="text"
            id="student-search"
            class="borrowing-input"
            placeholder="نام، نام خانوادگی یا کد دانش‌آموزی را وارد کنید"
            autocomplete="off"
        >

        <input
            type="hidden"
            id="student-id"
            name="student_id"
        >


        <div
            id="student-results"
            class="search-results"
        ></div>


        <div
            id="selected-student"
            class="selected-box"
        ></div>

    </div>


    <div class="borrowing-divider"></div>


    <!-- =========================
         کتاب اول
    ========================== -->

    <div class="borrowing-section-title">
        📖 انتخاب کتاب‌ها
    </div>


    <div class="borrowing-form-group">

        <label>

            <span class="book-number">
                ۱
            </span>

            کتاب اول

            <span class="optional-text">
                (اجباری)
            </span>

        </label>


        <input
            type="text"
            id="book1-search"
            class="borrowing-input"
            placeholder="عنوان کتاب یا شماره کنگره را وارد کنید"
            autocomplete="off"
        >


        <input
            type="hidden"
            id="book1-id"
            name="book1_id"
        >


        <div
            id="book1-results"
            class="search-results"
        ></div>


        <div
            id="selected-book1"
            class="selected-box"
        ></div>

    </div>


    <!-- =========================
         کتاب دوم
    ========================== -->

    <div class="borrowing-form-group">

        <label>

            <span class="book-number">
                ۲
            </span>

            کتاب دوم

            <span class="optional-text">
                (اختیاری)
            </span>

        </label>


        <input
            type="text"
            id="book2-search"
            class="borrowing-input"
            placeholder="عنوان کتاب یا شماره کنگره را وارد کنید"
            autocomplete="off"
        >


        <input
            type="hidden"
            id="book2-id"
            name="book2_id"
        >


        <div
            id="book2-results"
            class="search-results"
        ></div>


        <div
            id="selected-book2"
            class="selected-box"
        ></div>

    </div>


    <!-- =========================
         کتاب سوم
    ========================== -->

    <div class="borrowing-form-group">

        <label>

            <span class="book-number">
                ۳
            </span>

            کتاب سوم

            <span class="optional-text">
                (اختیاری)
            </span>

        </label>


        <input
            type="text"
            id="book3-search"
            class="borrowing-input"
            placeholder="عنوان کتاب یا شماره کنگره را وارد کنید"
            autocomplete="off"
        >


        <input
            type="hidden"
            id="book3-id"
            name="book3_id"
        >


        <div
            id="book3-results"
            class="search-results"
        ></div>


        <div
            id="selected-book3"
            class="selected-box"
        ></div>

    </div>


    <!-- دکمه -->

    <button type="submit">
        📚 ثبت امانت
    </button>


    <button
        type="button"
        onclick="history.back()"
    >
        بازگشت
    </button>


</form>


<script src="/static/script/new_borrowing_search.js">

  

</script>

{% endblock %}
