
<br><br>
{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        <div class="flash-container">

            {% for category, message in messages %}

                <div class="flash-message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}


<style>

.flash-container {
   text-align: right;

    top: 20px;
    right: 20px;

    z-index: 9999;

    display: flex;
    flex-direction: column;

    gap: 10px;
   
    margin: 0 50px;

}


.flash-message {
    min-width: 260px;

    padding: 14px 20px;

    border-radius: 12px;

    font-family: Tahoma, sans-serif;

    font-size: 14px;

    font-weight: bold;

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);

    animation: flash-in 0.3s ease;
}


.flash-message.success {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #86efac;
}


.flash-message.danger {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
}


.flash-message.warning {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fcd34d;
}


.flash-message.info {
    background: #dbeafe;
    color: #1e40af;
    border: 1px solid #93c5fd;
}


@keyframes flash-in {

    from {
        opacity: 0;
        transform: translateX(30px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}


@media (max-width: 600px) {

    .flash-container {
        top: 15px;
        right: 15px;
        left: 15px;
    }

    .flash-message {
        min-width: auto;
        width: 100%;
    }

}
@font-face {
    font-family: 'Vazir';
    src: url('./fonts/Vazir-Regular.ttf');
}

* {

    font-family: vazir;
}
</style>
