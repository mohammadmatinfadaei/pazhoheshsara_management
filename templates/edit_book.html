{% extends 'base.html' %}

{% block content %}

{% include 'flash.html' %}

<link rel="stylesheet" href="/static/style/add_book.css">

<br><br>

<div class="book-page-title">
    <h1>📚 ویرایش کردن کتاب</h1>
    <p>اطلاعات لازم جهت ویرایش کتاب را وارد کنید</p>
</div>

<form action="{{ url_for('edit_book', book_id=book.id) }}" method="POST" class="book-form">


    


    <div class="form-group">
        <label>عنوان کتاب</label>
        <input type="text" name="book_title" placeholder="عنوان کتاب را وارد کنید" value="{{ book.book_title }}"
            required>
    </div>


    <div class="form-group">
        <label>نویسنده / مترجم</label>
        <input type="text" name="author_translator" placeholder="نویسنده یا مترجم را وارد کنید"
            value="{{ book.author_translator }}" required>
    </div>


    <div class="form-group">
        <label>شماره کنگره</label>
        <input type="text" name="congress_number" placeholder="شماره کنگره را وارد کنید"
            value="{{ book.congress_number }}" required>
    </div>




    <div class="form-group">
        <label>شماره قفسه</label>
        <input type="number" step="any" name="shelf_number" placeholder="شماره قفسه را وارد کنید" value="{{ book.shelf_number }}">
    </div>


    <div class="form-group">
        <label>شماره ردیف</label>
        <input type="number" step="any" name="row_number" placeholder="شماره ردیف را وارد کنید" value="{{ book.row_number }}">
    </div>


    <div class="form-group checkbox-group">

        <label class="checkbox-label">

            <input type="checkbox" name="comprehensive" value="True" {% if book.comprehensive==True %}checked{% endif
                %}>

            <span>مرجع است</span>

        </label>

    </div>


    <button type="submit">
        ذخیره تغییرات
    </button>
  <button     onclick="history.back()">
        بازگشت 
    </button>

</form>

{% endblock %}
